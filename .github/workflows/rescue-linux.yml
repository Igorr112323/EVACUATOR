name: Rescue Linux verification

on:
  push:
    branches:
      - arena/9335e807-evacuator
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: .NET ${{ matrix.snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        snapshot: [baseline, current]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export the exact snapshot without changing branches
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.snapshot }}' = baseline ]; then
            source_commit=d07566376b333d9dd107bb5bb0f7065fdb087a7d
          else
            source_commit="$GITHUB_SHA"
          fi
          git cat-file -e "${source_commit}^{commit}"
          mkdir -p "$RUNNER_TEMP/evacuator-source" "$RUNNER_TEMP/evacuator-evidence"
          git archive "$source_commit" | tar -x -C "$RUNNER_TEMP/evacuator-source"
          printf '%s\n' "$source_commit" > "$RUNNER_TEMP/evacuator-evidence/source-commit.txt"
          printf 'commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Install the official Microsoft .NET SDK
        id: setup
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/evacuator-dotnet
        with:
          dotnet-version: 10.0.400

      - name: Build, test, and exercise CLI
        id: verify
        continue-on-error: true
        shell: bash
        env:
          EVAC_SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          export NUGET_PACKAGES="$RUNNER_TEMP/evacuator-nuget-packages"
          bash tools/verify-dotnet-linux.sh "$RUNNER_TEMP/evacuator-source" "$RUNNER_TEMP/evacuator-evidence"

      - name: Upload raw logs, TRX, and CLI artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: evacuator-${{ matrix.snapshot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evacuator-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Pack a checks-API copy of the evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/evacuator-evidence"
          if [ ! -d "$dir" ]; then
            echo '::warning title=EVACUATOR_EVIDENCE_MISSING::Source export did not produce evidence.'
            exit 0
          fi
          tar -czf "$RUNNER_TEMP/evacuator-evidence.tar.gz" -C "$dir" .
          sha=$(sha256sum "$RUNNER_TEMP/evacuator-evidence.tar.gz" | cut -d ' ' -f 1)
          printf '::notice title=EVACUATOR_SHA256::%s\n' "$sha"
          base64 -w 0 "$RUNNER_TEMP/evacuator-evidence.tar.gz" | fold -w 3000 > "$RUNNER_TEMP/evacuator-parts.txt"
          printf '\n' >> "$RUNNER_TEMP/evacuator-parts.txt"
          if [ "$(wc -l < "$RUNNER_TEMP/evacuator-parts.txt")" -gt 36 ]; then
            echo '::warning title=EVACUATOR_EVIDENCE_TOO_LARGE::Use the uploaded artifact; checks copy omitted.'
            exit 1
          fi

      - name: Expose evidence parts 1-9
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/evacuator-parts.txt" ]; then
            awk 'NR >= 1 && NR <= 9 { printf "::notice title=EVACUATOR_PART_%03d::%s\n", NR, $0 }' "$RUNNER_TEMP/evacuator-parts.txt"
          fi

      - name: Expose evidence parts 10-18
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/evacuator-parts.txt" ]; then
            awk 'NR >= 10 && NR <= 18 { printf "::notice title=EVACUATOR_PART_%03d::%s\n", NR, $0 }' "$RUNNER_TEMP/evacuator-parts.txt"
          fi

      - name: Expose evidence parts 19-27
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/evacuator-parts.txt" ]; then
            awk 'NR >= 19 && NR <= 27 { printf "::notice title=EVACUATOR_PART_%03d::%s\n", NR, $0 }' "$RUNNER_TEMP/evacuator-parts.txt"
          fi

      - name: Expose evidence parts 28-36
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/evacuator-parts.txt" ]; then
            awk 'NR >= 28 && NR <= 36 { printf "::notice title=EVACUATOR_PART_%03d::%s\n", NR, $0 }' "$RUNNER_TEMP/evacuator-parts.txt"
          fi

      - name: Report verification result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/evacuator-evidence/overall-exit.txt"
          if [ ! -f "$file" ]; then
            echo 'Verification was not completed; inspect setup and prior steps.' >&2
            exit 1
          fi
          test "$(cat "$file")" = 0
